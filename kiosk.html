<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vihara Attendance - QR Kios</title>
  <link rel="stylesheet" href="style.css">
  <!-- Library Generator QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      background: #f4efe6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    .kiosk-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(92, 64, 51, 0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
      border: 1px solid rgba(92, 64, 51, 0.15);
    }
    .kiosk-title {
      font-size: 20px;
      font-weight: 800;
      color: #3b2c23;
      margin-bottom: 6px;
    }
    .kiosk-sub {
      font-size: 13px;
      color: #7a6352;
      margin-bottom: 24px;
    }
    #qrcode-container {
      display: flex;
      justify-content: center;
      padding: 16px;
      background: #fbf9f5;
      border-radius: 16px;
      border: 2px dashed #3d5a45;
      margin-bottom: 20px;
    }
    .timer-bar-bg {
      width: 100%;
      height: 8px;
      background: #eaf0eb;
      border-radius: 10px;
      overflow: hidden;
    }
    .timer-bar-fill {
      height: 100%;
      background: #3d5a45;
      width: 100%;
      transition: width 1s linear;
    }
    .timer-text {
      font-size: 12px;
      font-weight: 700;
      color: #3d5a45;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="kiosk-card">
    <div style="font-size: 32px; margin-bottom: 8px;">☸️</div>
    <div class="kiosk-title">PRESENSI VEHARA</div>
    <div class="kiosk-sub">Arahkan kamera HP Anda untuk melakukan absensi</div>

    <div id="qrcode-container">
      <div id="qrcode"></div>
    </div>

    <div class="timer-bar-bg">
      <div id="timer-bar" class="timer-bar-fill"></div>
    </div>
    <div id="timer-text" class="timer-text">Memperbarui dalam 15s</div>
  </div>

  <script src="kiosk.js"></script>
</body>
</html>
