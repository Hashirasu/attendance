<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mudiviverse</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <div class="app">
    <!-- 1. LOGIN / REGISTER PANEL -->
    <section id="login-section" class="panel">
      <div class="brand-header">
        <div class="logo-box">
            <img src="logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <span class="brand-title">MUDIVIVERSE</span>
      </div>

      <div class="form-group" id="name-group" style="display: none;">
        <input type="text" id="register-name" placeholder="Nama Lengkap" class="custom-input">
      </div>

      <div class="form-group">
        <input type="email" id="email" placeholder="contoh@email.com" class="custom-input">
      </div>

      <div class="form-group">
        <input type="password" id="password" placeholder="Enter your Password" class="custom-input">
      </div>

      <button id="auth-main-button" class="main-button">
        <span id="auth-button-text">Masuk</span>
      </button>

      <div class="auth-toggle-box">
        <span id="toggle-auth-text">Belum punya akun?</span>
        <button id="toggle-auth-btn" class="link-button">Daftar di sini</button>
      </div>

      <p id="message" style="margin-top: 14px; font-size: 13px; color: var(--ios-red); text-align: center; font-weight: 600;"></p>
    </section>

    <!-- 2. USER DASHBOARD -->
    <section id="user-section" class="panel" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid rgba(0,0,0,0.05); margin-bottom: 24px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="logo-box" style="width: 38px; height: 38px;">
            <img src="logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
          </div>
          <div>
            <h3 style="font-weight: 700; font-size: 16px;">Mudiviverse</h3>
            <span id="user-code" style="font-size: 11px; color: var(--text-sub); font-weight: 600;">-</span>
          </div>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="switch-to-admin" class="secondary-button" style="display: none;">Admin</button>
          <button id="logout-button" class="secondary-button" style="color: var(--ios-red);">Logout</button>
        </div>
      </div>

      <div style="margin-bottom: 24px;">
        <h2 style="font-size: 24px; font-weight: 700; letter-spacing: -0.5px;">Halo, <span id="user-name-display">Member</span></h2>
        <p style="color: var(--text-sub); font-size: 14px; margin-top: 4px;">Selamat datang kembali di dashboard Anda.</p>
      </div>

      <div class="today-grid">
        <div class="card-box">
          <span class="card-badge">Hari Ini</span>
          <div id="today-status" style="margin-top: 12px;">
            <p>Memuat status...</p>
          </div>
        </div>

        <div class="card-box" style="display: flex; flex-direction: column; justify-content: space-between;">
          <div>
            <span class="card-badge">Kehadiran</span>
            <h4 style="font-size: 16px; margin-top: 8px; font-weight: 600;">Catat Presensi</h4>
          </div>
          <button id="check-in-button" class="main-button" style="padding: 12px; font-size: 13px; margin-top: 12px;">
            Hadir
          </button>
          <p id="attendance-message" style="font-size: 11px; margin-top: 8px; color: var(--text-sub); text-align: center;"></p>
        </div>
      </div>

      <div class="card-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h3 style="font-size: 16px; font-weight: 700;">Riwayat Absensi</h3>
          <svg width="18" height="18" stroke="var(--text-sub)" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </div>
        <div id="attendance-history">
          <p>Memuat riwayat...</p>
        </div>
      </div>
    </section>

    <!-- 3. ADMIN PANEL -->
    <section id="admin-section" class="panel" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid rgba(0,0,0,0.05); margin-bottom: 24px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="logo-box" style="width: 38px; height: 38px;">
            <img src="logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
          </div>
          <div>
            <h3 style="font-weight: 700; font-size: 16px;">Admin Panel</h3>
          </div>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="switch-to-user" class="secondary-button">User</button>
          <button id="admin-logout-button" class="secondary-button" style="color: var(--ios-red);">Logout</button>
        </div>
      </div>

      <div class="admin-tabs">
        <button id="tab-rekap-btn" class="tab-btn active" type="button">Data Absensi</button>
        <button id="tab-karyawan-btn" class="tab-btn" type="button">Anggota</button>
      </div>

      <div id="admin-view-rekap">
        <div class="card-box">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3 style="font-size: 16px; font-weight: 700;">Rekap Kehadiran</h3>
            <button id="export-csv-btn" class="secondary-button btn-export" type="button">
              <span style="display:flex; align-items:center; gap:4px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export
              </span>
            </button>
          </div>

          <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="date" id="admin-filter-date" class="custom-input" style="padding: 10px; font-size: 13px;">
            <select id="admin-filter-status" class="custom-select" style="padding: 10px; font-size: 13px;">
              <option value="ALL">Semua</option>
              <option value="present">Tepat Waktu</option>
              <option value="late">Terlambat</option>
            </select>
          </div>

          <div id="admin-attendance-list">
            <p>Memuat data...</p>
          </div>
        </div>
      </div>

      <div id="admin-view-karyawan" style="display: none;">
        <div class="card-box">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3 style="font-size: 16px; font-weight: 700;">Kelola Anggota</h3>
            <svg width="18" height="18" stroke="var(--text-sub)" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div id="admin-employee-list">
            <p>Memuat anggota...</p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- MODAL EDIT MEMBER -->
  <div id="edit-emp-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3 style="font-weight: 700; font-size: 18px; margin-bottom: 18px;">Edit Akun</h3>
      <input type="hidden" id="edit-emp-id">

      <div class="form-group">
        <label>Nama</label>
        <input type="text" id="edit-emp-name" class="custom-input">
      </div>
      <div class="form-group">
        <label>Kode</label>
        <input type="text" id="edit-emp-code" class="custom-input">
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="edit-emp-role" class="custom-select">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="edit-emp-active" class="custom-select">
          <option value="true">Aktif</option>
          <option value="false">Nonaktif</option>
        </select>
      </div>

      <p id="edit-modal-msg" style="font-size: 12px; color: var(--ios-red); font-weight: 600; margin-top: 10px;"></p>

      <div style="display: flex; gap: 10px; margin-top: 24px;">
        <button id="cancel-edit-emp" class="secondary-button" type="button" style="flex: 1;">Batal</button>
        <button id="save-edit-emp" class="main-button" type="button" style="flex: 1; margin: 0;">Simpan</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
