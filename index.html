<!-- Live Background Video -->
<div class="video-background-container">
  <video autoplay muted loop id="bg-video">
    <!-- Ganti url video lofi/calm kesukaanmu (mp4) -->
    <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-the-night-sky-4000-large.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>
</div>

<!-- Main Desktop App Layout -->
<div class="app-workspace">
  <!-- Left Glass Sidebar -->
  <aside class="glass-sidebar">
    <div class="user-avatar-box">
      <div class="avatar-circle">H</div>
      <span class="user-name">Heinrich</span>
    </div>
    
    <nav class="nav-menu">
      <button class="nav-btn active" data-tab="home"><span class="icon">🏠</span> Home</button>
      <button class="nav-btn" data-tab="attendance"><span class="icon">📋</span> Absensi</button>
      <button class="nav-btn" data-tab="admin" id="sidebar-admin-btn" style="display:none;"><span class="icon">⚙️</span> Admin Panel</button>
    </nav>
  </aside>

  <!-- Main Content Window -->
  <main class="glass-content-window">
    <header class="top-bar">
      <div id="live-clock">00:00:00 WIB</div>
      <div class="top-actions">
        <button id="quick-scan-btn" class="glass-button">📷 Quick Scan</button>
      </div>
    </header>

    <div class="workspace-views">
      <!-- Tab Content Area -->
      <section id="view-home" class="tab-view active">
        <div class="welcome-card glass-card">
          <h2>Selamat Datang Kembali 👋</h2>
          <p>Jangan lupa untuk melakukan absensi kehadiran hari ini.</p>
        </div>
      </section>
    </div>
  </main>
</div>
